model:
  attention: true
  binaural: true
  use_depthwise: true
  ild_weight: 1
  ipd_weight: 10
  snr_loss_weight: 1
  stoi_weight: 10
  masking_mode: C
  rnn_layers: 2
  rnn_units: 128
  win_len: 128
  win_inc: 80
  fft_len: 128
  win_type: hamming
  kernel_size: 5
  kernel_num:
  - 16
  - 32
  - 64
  - 128
  - 256
  - 256
  embed_dim: 256
  num_heads: 16
  attn_win: 31
  tied_mha: true
  attention_softmax:
    mode: shift_topk_pow2_clamp8_nomantissa
  attention_datapath:
    enabled: true
    score_quant: none
    prob_quant: none
    qk_scale_mode: pow2
    score_fixed_int_bits: null
    score_fixed_frac_bits: null
    finite_mask_threshold: -10000.0
    lmul_enabled: true
    lmul_targets:
    - qk
    lmul_mantissa_bits: 8
    lmul_qk_chunk_size: 32
    lmul_qk_force_dense: false
    lmul_all_projection_ops: false
    lmul_linear_chunk_size: 0
    lmul_checkpoint_chunks: false
    lmul_bit_exact: true
    prob_packet:
      enabled: true
      top_k: 4
      local_idx_bits: 5
      causal_window: null
      prob_bits: 8
      prob_scale: 256
      prob_max_code: 255
      score_v_mode: lmul
      validate_local_idx: true
      renormalize: false
    topk_stability_min_jaccard: 0.98
    top1_flip_max_rate: 0.01
  low_power:
    prelu_pow2:
      enabled: true
      min_exp: -8
      max_exp: 0
    bn_affine:
      scale_mode: fold_apot
      tie_real_imag_scale: false
      pow2_min_exp: -9
      pow2_max_exp: 4
    mha_projection:
      enabled: true
      input_proj_groups: 1
      qkv_groups: 4
      out_proj_groups: 1
      output_proj_groups: 1
    all_lmul_multiply:
      enabled: false
      mantissa_bits: 4
      bit_exact: true
      linear_chunk_size: 0
      checkpoint_chunks: false
      attention_mantissa_bits: null
      learnable_bias_correction:
        enabled: false
        init_value: 0.0
      ste_mode: real
    outlier_fp8_lmul:
      enabled: true
      mantissa_bits: 4
      bit_exact: true
  decoder_grouped_pointwise:
    mode: grouped
    groups_x: 4
    groups_skip: 2
    channel_shuffle: false
    skip_select_ratio: 0.5
    skip_select_mode: topk_l1
    skip_indices_path: /raid/R12K41024/14_low_power_arch_qat/Checkpoints/p2_skip_indices_g42_topk_l1_r050.pt
  kd:
    enabled: true
    teacher_output_dir: /raid/R12K41024/18_w4a8_pow2_mixed_lmul/teacher_outputs/d1c3_epoch25_step100672_fp16
    teacher_noisy_root: /raid/R12K41024/BCCTN/Dataset/noisy_trainset
    lambda_kd: 0.0528721747
    kd_mode: binaural
    stft_n_fft: 128
    stft_hop: 80
training:
  accelerator: auto
  batch_size: 128
  accumulate_grad_batches: 1
  num_sanity_val_steps: 0
  learning_rate: 1.0e-05
  lr_scheduler: plateau
  plateau:
    factor: 0.5
    patience: 3
    threshold: 0.05
    min_lr: 1.0e-06
  learning_rate_decay_steps:
  - 15
  - 30
  - 45
  learning_rate_decay_values: 0.5
  n_epochs: 15
  n_workers: 4
  prefetch_factor: 4
  pin_memory: true
  limit_train_batches: 1.0
  limit_val_batches: 1.0
  checkpoint_save_top_k: 3
  train_checkpoint_path: /raid/R12K41024/18_w4a8_pow2_mixed_lmul/outputs/d1c3_pow2_finetune/d1c3_apotclip16_attnm8_outlierm4_15ep/ft/logs/lightning_logs/version_0/checkpoints/epoch=2-step=726.ckpt
  resume_ckpt_path: null
  mixed_precision_qat: true
  qat_scope: full
  top_k_attention: 4
  int4_group_size: 32
  int4_scale_format: apot_clip
  fp16_accumulator: true
  fp8_qat: false
  fp8_dtype: e4m3
  early_stopping:
    enabled: true
    key_to_monitor: validation_loss
    min_delta: 0.05
    patience_in_epochs: 20
dataset:
  sr: 16000
  noisy_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_trainset
  noisy_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_valset
  noisy_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset/snr_0dB
  noisy_test_timit_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset_timit
  target_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_trainset
  target_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_valset
  target_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset
  target_test_timit_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset_timit
