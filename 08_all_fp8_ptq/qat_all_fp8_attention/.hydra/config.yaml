model:
  attention: true
  binaural: true
  use_depthwise: true
  ild_weight: 1
  ipd_weight: 10
  snr_loss_weight: 1
  stoi_weight: 10
  masking_mode: C
  rnn_layers: 2
  rnn_units: 128
  win_len: 128
  win_inc: 80
  fft_len: 128
  win_type: hamming
  kernel_size: 5
  kernel_num:
  - 16
  - 32
  - 64
  - 128
  - 256
  - 256
  embed_dim: 256
  num_heads: 16
  attn_win: 31
training:
  accelerator: auto
  batch_size: 32
  learning_rate: 0.0001
  lr_scheduler: plateau
  plateau:
    factor: 0.5
    patience: 3
    threshold: 0.05
    min_lr: 1.0e-06
  learning_rate_decay_steps:
  - 15
  - 30
  - 45
  learning_rate_decay_values: 0.5
  n_epochs: 30
  n_workers: 4
  pin_memory: true
  train_checkpoint_path: /raid/R12K41024/08_all_fp8_ptq/epoch=134-step=130680.ckpt
  mixed_precision_qat: true
  qat_scope: full
  top_k_attention: null
  int4_group_size: 256
  fp8_qat: false
  fp8_dtype: e4m3
  early_stopping:
    enabled: true
    key_to_monitor: validation_loss
    min_delta: 0.05
    patience_in_epochs: 20
  fp8_attention: true
  fp8_scale: true
dataset:
  sr: 16000
  noisy_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_trainset
  noisy_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_valset
  noisy_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset/snr_0dB
  noisy_test_timit_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset_timit
  target_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_trainset
  target_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_valset
  target_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset
  target_test_timit_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset_timit
