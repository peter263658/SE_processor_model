dataset:
  noisy_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset/snr_0dB
  noisy_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_trainset
  noisy_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_valset
  target_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset
  target_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_trainset
  target_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_valset
defaults:
- model
- training
- dataset: speech_dataset

model:
  attention: true
  binaural: true
  use_depthwise: true
  # Loss function weights as described in the paper (section 3.1)
  ild_weight: 1        # Weight for ILD loss (γ)
  ipd_weight: 10       # Weight for IPD loss (κ)
  snr_loss_weight: 1   # Weight for SNR loss (α)
  stoi_weight: 10      # Weight for STOI loss (β)
  # Model architecture parameters
  use_clstm: true
  use_cbn: true
  masking_mode: 'E'
  rnn_layers: 2
  rnn_units: 128
  # win_len: 400         # 25ms at 16kHz
  # win_inc: 100         # 6.25ms at 16kHz
  # fft_len: 512
  win_len: 128         # 25ms at 16kHz
  win_inc: 80         # 6.25ms at 16kHz
  fft_len: 128
  win_type: 'hann'
  kernel_size: 5
  # Kernel numbers for encoder-decoder layers as per paper
  # kernel_num: [16, 32, 64, 128, 256, 256]
  kernel_num: [16, 32, 64, 128, 256, 256]
  bidirectional: false
  embed_dim: 512       # Embedding dimension for transformer
  num_heads: 32     # Number of attention heads as mentioned in paper
  attn_win: 32   # Window size for attention mechanism


training:
  accelerator: auto
  batch_size: 16
  learning_rate: 0.0001  # Initial learning rate as per paper
  learning_rate_decay_steps: [10, 20]
  learning_rate_decay_values: 0.5
  n_epochs: 100       # Number of epochs as per paper
  n_workers: 4
  pin_memory: true
  strategy: auto
  train_checkpoint_path: "/raid/R12K41024/BCCTN_sep_conv_causal_slide_win/model.ckpt"
  logger: true
  early_stopping:
    enabled: true
    key_to_monitor: validation_loss
    min_delta: 0.01
    patience_in_epochs: 5  # Early stopping after 3 epochs of no improvement


# NEW: Quantization and Pruning Configuration
quantization:
  # Enable pruning-aware quantization aware training
  enable_pruning_qat: true
  
  # Quantization type: "int8" or "fp8" (fp8 requires Hopper GPU)
  type: "int8"
  
  # Training phases configuration
  # qat_phase: "normal"  # Options: "normal", "calibration", "training"
  calibration_steps: 100  # Number of calibration steps
  skip_normal_training: true  # Set to true if using pre-trained model
  qat_fine_tune_epochs: 5  # Add this line
  # Pruning configuration
  base_pruning_ratio: 0.3  # 30% base pruning ratio
  
  # Advanced pruning configuration (optional)
  # If not specified, automatic configuration will be used
  pruning_config:
    # Encoder layers - more aggressive pruning for deeper layers
    "encoder.model.0.0": 0.25   # First encoder conv layer - 25% pruning
    "encoder.model.1.0": 0.30   # Second encoder conv layer - 30% pruning
    "encoder.model.2.0": 0.35   # Third encoder conv layer - 35% pruning
    "encoder.model.3.0": 0.40   # Fourth encoder conv layer - 40% pruning
    "encoder.model.4.0": 0.45   # Fifth encoder conv layer - 45% pruning
    "encoder.model.5.0": 0.50   # Sixth encoder conv layer - 50% pruning
    
    # Decoder layers - more conservative pruning
    "decoder.model.0.0": 0.20   # First decoder conv layer - 20% pruning
    "decoder.model.1.0": 0.25   # Second decoder conv layer - 25% pruning
    "decoder.model.2.0": 0.30   # Third decoder conv layer - 30% pruning
    "decoder.model.3.0": 0.25   # Fourth decoder conv layer - 25% pruning
    "decoder.model.4.0": 0.20   # Fifth decoder conv layer - 20% pruning
    "decoder.model.5.0": 0.15   # Sixth decoder conv layer - 15% pruning
    
    # Attention layers - very conservative pruning
    "mattn.input_proj": 0.10    # Attention input projection - 10% pruning
    "mattn.output_proj": 0.10   # Attention output projection - 10% pruning

# Optimization targets and constraints
optimization:
  # Target compression ratio (1.0 = no compression, 0.5 = 50% reduction)
  target_compression_ratio: 0.4
  
  # Performance constraints
  max_accuracy_drop: 0.02  # Maximum allowable MBSTOI drop (2%)
  min_speedup_target: 2.0  # Minimum target speedup
  
  # Export settings
  export_optimized_model: true
  export_path: "./optimized_models/"
  
  # Validation during optimization
  validate_during_pruning: true
  validation_frequency: 5  # Validate every 5 epochs during QAT