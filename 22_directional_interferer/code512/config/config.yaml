model:
  binaural: true
  attention: true
  use_clstm: true
  use_cbn: true
  masking_mode: E
  rnn_layers: 2
  rnn_units: 128
  win_len: 400
  win_inc: 100
  fft_len: 512
  win_type: hann
  kernel_size: 5
  kernel_num:
  - 16
  - 32
  - 64
  - 128
  - 256
  - 256
  bidirectional: false
  embed_dim: 512
  num_heads: 32
  ild_weight: 1
  ipd_weight: 10
  snr_loss_weight: 1
  stoi_weight: 10
training:
  batch_size: 32
  n_epochs: 100
  learning_rate: 0.001
  learning_rate_decay_steps:
  - 3
  - 8
  learning_rate_decay_values: 0.5
  n_workers: 4
  test_checkpoint_path: /raid/R12K41024/BCCTN/DCNN/Checkpoints/Trained_model.ckpt
  train_checkpoint_path: null
  strategy: auto
  pin_memory: true
  accelerator: auto
  early_stopping:
    enabled: true
    key_to_monitor: validation_loss
    min_delta: 0.01
    patience_in_epochs: 3
  logger: true
dataset:
  sr: 16000
  noisy_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_trainset
  noisy_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_valset
  noisy_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset/snr_0dB
  noisy_test_timit_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset_timit
  target_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_trainset
  target_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_valset
  target_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset
  target_test_timit_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset_timit
