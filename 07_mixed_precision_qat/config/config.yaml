dataset:
  noisy_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_testset/snr_0dB
  noisy_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_trainset
  noisy_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/noisy_valset
  target_test_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_testset
  target_training_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_trainset
  target_validation_dataset_dir: /raid/R12K41024/BCCTN/Dataset/clean_valset
defaults:
- model
- training
- dataset: speech_dataset
model:
  attention: true
  binaural: true
  use_depthwise: true
  # Loss function weights as described in the paper (section 3.1)
  ild_weight: 1        # Weight for ILD loss (γ)
  ipd_weight: 10       # Weight for IPD loss (κ)
  snr_loss_weight: 1   # Weight for SNR loss (α)
  stoi_weight: 10      # Weight for STOI loss (β)
  masking_mode: 'C'
  rnn_layers: 2
  rnn_units: 128
  # win_len: 400         # 25ms at 16kHz
  # win_inc: 100         # 6.25ms at 16kHz
  # fft_len: 512


  # win_len: 256         # 25ms at 16kHz
  # win_inc: 80         # 6.25ms at 16kHz
  # fft_len: 256

  win_len: 128         # 25ms at 16kHz
  win_inc: 80         # 6.25ms at 16kHz
  fft_len: 128

  win_type: 'hamming'   # matches feature_extractors.py (hardcoded hamming)
  kernel_size: 5
  # Kernel numbers for encoder-decoder layers as per paper
  # kernel_num: [16, 32, 64, 128, 256, 256]
  kernel_num: [16, 32, 64, 128, 256, 256]
  embed_dim: 256    # Embedding dimension for transformer
  num_heads: 16     # Number of attention heads as mentioned in paper
  attn_win: 31      # Window size for attention mechanism
training:
  accelerator: auto
  batch_size: 32
  # Fine-tune from FP8 checkpoint; relaxed LR for W4A8 QAT
  learning_rate: 0.0005
  # Adaptive LR: halve when val_loss plateaus, instead of fixed epoch milestones.
  lr_scheduler: plateau
  plateau:
    factor: 0.5
    patience: 2         # halve LR after 2 epochs without improvement > threshold
    threshold: 0.05     # val_loss noise band ~0.05 (std ~1.9, per-epoch drift)
    min_lr: 1.0e-6
  # Kept for fallback when lr_scheduler != plateau
  learning_rate_decay_steps: [15, 30, 45]
  learning_rate_decay_values: 0.5
  n_epochs: 120         # previous run best was epoch 50/60 → extend budget
  n_workers: 4
  pin_memory: true
  # Resume from pre-trained FP8 QAT checkpoint (epoch=134)
  train_checkpoint_path: /raid/R12K41024/07_mixed_precision_qat/epoch=134-step=130680.ckpt
  # Mixed-Precision W4A8 QAT (takes precedence over fp8_qat)
  mixed_precision_qat: true
  qat_scope: mha_only   # "full" = W4 on conv+MHA (07 handoff plan);
                        # "mha_only" = conv stays FP8, only MHA projections use W4A8
  # top-K only sparsifies softmax·V (≤11% MHA MACs) and gives 0 DMA saving.
  # Projection W4A8 (~76% MHA MACs, halves weight DMA) is the real win — isolate it.
  top_k_attention: null
  int4_group_size: 256
  fp8_qat: false        # superseded by mixed_precision_qat
  fp8_dtype: "e4m3"     # activation format for W4A8 path too
  early_stopping:
    enabled: true
    key_to_monitor: validation_loss
    min_delta: 0.05          # match val_loss noise band (was 0.001, too tight)
    patience_in_epochs: 12   # > 2×plateau.patience, so LR can decay ~3 times before stopping